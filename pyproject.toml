[project]
name = "predict-strength"
version = "0.1.0"
description = "A lightweight ML strength predicter project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "torch",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
